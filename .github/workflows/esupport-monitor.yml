name: Contrôle quotidien eSupport

on:
  push:
    branches: [main]
  schedule:
    # Léonard vérifie chaque heure si ses quatre sources sont enfin complètes.
    # La vérification reste silencieuse et ne crée aucune mission si une donnée manque.
    - cron: "37 * * * *"
    # Synchronisation quotidienne à 10 h Europe/Paris. Les deux créneaux UTC
    # couvrent automatiquement l'heure d'été et l'heure d'hiver ; le workflow
    # ignore celui qui ne correspond pas à 10 h à Paris.
    - cron: "7 8 * * *"
    - cron: "7 9 * * *"
    # Rapport quotidien d'Oscar à 11 h 30 Europe/Paris. Les deux créneaux UTC
    # couvrent automatiquement l'heure d'été et l'heure d'hiver ; un garde-fou
    # ignore celui qui ne correspond pas réellement à 11 h à Paris.
    - cron: "30 9 * * *"
    - cron: "30 10 * * *"
    # Rapport de synthèse chaque lundi et jeudi, autour de 07 h à Paris.
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: esupport-monitor
  cancel-in-progress: false

jobs:
  porte-leonard:
    name: Porte de complétude de Léonard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Vérifier les quatre sources sans produire de rapport incomplet
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          LEONARD_SERVICE_URL: https://performance-hub-lykos-fc.fab-mysterio.chatgpt.site/api/estaff/worker/leonard-analysis
        with:
          script: |
            const identity = await core.getIDToken("lykos-estaff-esupport");
            const response = await fetch(process.env.LEONARD_SERVICE_URL, {
              method: "POST",
              headers: {Authorization: `Bearer ${identity}`},
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
              core.setFailed(`La porte de Léonard a refusé la vérification (${response.status}).`);
              return;
            }
            if (result.status === "queued") core.notice("Les quatre sources sont complètes : Léonard est activé.");
            else if (result.status === "complete") core.notice("Le brief de Léonard existe déjà pour cet événement.");
            else core.notice("Léonard reste silencieux : le dossier complet n’est pas encore réuni.");

  chaine-esupport:
    name: Patricia → Gaston → Véronique → Oscar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      pages: write
    steps:
      - name: Déterminer la mission eSupport
        id: mission
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PUBLIC_INDIVIDUAL_DATA_AUTHORIZED: ${{ vars.PUBLIC_INDIVIDUAL_DATA_AUTHORIZED }}
        with:
          script: |
            const isManual = context.eventName === "workflow_dispatch";
            const isPush = context.eventName === "push";
            const requestedSyncPush = isPush && /\[esupport-sync\]/i.test(context.payload.head_commit?.message || "");
            const scheduledCron = context.payload.schedule || "";
            const parisHour = Number(new Intl.DateTimeFormat("fr-FR", {
              timeZone: "Europe/Paris",
              hour: "2-digit",
              hour12: false,
            }).format(new Date()));
            const dailyWindow = ["7 8 * * *", "7 9 * * *"].includes(scheduledCron);
            const daily = dailyWindow && parisHour === 10;
            const oscarWindow = ["30 9 * * *", "30 10 * * *"].includes(scheduledCron) && parisHour === 11;
            const digest = scheduledCron === "17 6 * * 1,4";
            const syncRequested = isManual || daily || requestedSyncPush;
            const individualPublicationAuthorized = process.env.PUBLIC_INDIVIDUAL_DATA_AUTHORIZED === "verified";
            const active = isManual || isPush || daily || digest;
            core.setOutput("active", String(active));
            core.setOutput("oscar", String(isManual || oscarWindow));
            core.setOutput("sync", String(syncRequested && individualPublicationAuthorized));
            core.setOutput("mode", digest ? "digest" : requestedSyncPush || isManual ? "manual" : isPush ? "release" : "daily");
            if (!active && !oscarWindow) core.notice("Ce déclenchement horaire concerne uniquement la porte de Léonard.");
            if (syncRequested && !individualPublicationAuthorized) {
              core.warning("Synchronisation nominative bloquée : le registre privé des autorisations n’est pas confirmé.");
            }

      - name: Récupérer le Performance Hub
        if: steps.mission.outputs.active == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Préparer Node.js
        if: steps.mission.outputs.sync == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"

      - name: Patricia prépare la collecte privée
        if: steps.mission.outputs.sync == 'true'
        run: |
          mkdir -p data/private/sporteasy github-pages sites-app/public
          cp automation/sporteasy-seed/*.json data/private/sporteasy/

      - name: Obtenir l’identité temporaire de Patricia
        if: steps.mission.outputs.sync == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken("lykos-estaff-esupport");
            core.setSecret(token);
            core.exportVariable("SPORTEASY_PROXY_TOKEN", token);

      - name: Patricia synchronise l’effectif et les sources statistiques
        id: sync_players
        if: steps.mission.outputs.sync == 'true'
        env:
          SPORTEASY_API_BASE_URL: https://performance-hub-lykos-fc.fab-mysterio.chatgpt.site/api/estaff/worker/sporteasy-read/
          SPORTEASY_TEAM_ID: "1080887"
          SPORTEASY_REQUEST_TIMEOUT_MS: "30000"
        run: |
          node scripts/sporteasy/sync-players.mjs
          node scripts/sporteasy/capture-statistics-sources.mjs
          node scripts/sporteasy/capture-statistics-details.mjs
          node scripts/sporteasy/capture-statistics-aggregate.mjs

      - name: Renouveler l’identité temporaire de Patricia
        if: steps.mission.outputs.sync == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken("lykos-estaff-esupport");
            core.setSecret(token);
            core.exportVariable("SPORTEASY_PROXY_TOKEN", token);

      - name: Patricia synchronise chaque match, présence et compte rendu
        id: sync_matches
        if: steps.mission.outputs.sync == 'true'
        env:
          SPORTEASY_API_BASE_URL: https://performance-hub-lykos-fc.fab-mysterio.chatgpt.site/api/estaff/worker/sporteasy-read/
          SPORTEASY_TEAM_ID: "1080887"
          SPORTEASY_REQUEST_TIMEOUT_MS: "30000"
        run: |
          node scripts/sporteasy/capture-event-statistics-all.mjs
          node scripts/sporteasy/capture-event-details-all.mjs
          node scripts/sporteasy/capture-match-ui-api-all.mjs

      - name: Gaston reconstruit les données sans modifier Metron
        id: build_data
        if: steps.mission.outputs.sync == 'true'
        env:
          ESTAFF_SKIP_METRON_DOCS: "1"
        run: |
          node scripts/sporteasy/build-statistics-repository.mjs
          node scripts/sporteasy/build-match-repository.mjs
          node scripts/sporteasy/build-player-secondary-statistics.mjs

      - name: Véronique contrôle et autorise la publication
        id: quality
        if: steps.mission.outputs.sync == 'true'
        run: |
          node scripts/verify-publication-tests.mjs
          node scripts/sporteasy/audit-match-repository.mjs
          node scripts/sporteasy/audit-player-secondary-statistics.mjs
          node scripts/sporteasy/publish-player-secondary-statistics.mjs
          node scripts/sporteasy/build-team-dashboard-data.mjs
          node scripts/sporteasy/build-pantheon-data.mjs
          node scripts/sporteasy/audit-public-data.mjs
          test -s github-pages/player-secondary-data.js
          test -s github-pages/team-data.js
          test -s github-pages/pantheon-data.js

      - name: Installer uniquement les fichiers validés
        if: steps.mission.outputs.sync == 'true'
        id: publication
        run: |
          cp github-pages/player-secondary-data.js player-secondary-data.js
          cp github-pages/team-data.js team-data.js
          cp github-pages/pantheon-data.js pantheon-data.js
          if git diff --quiet -- player-secondary-data.js team-data.js pantheon-data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Véronique publie la synchronisation validée
        id: publish_data
        if: steps.publication.outputs.changed == 'true'
        run: |
          git config user.name "eSupport Lykos"
          git config user.email "lykosfutsalclub@gmail.com"
          git add -- player-secondary-data.js team-data.js pantheon-data.js
          git commit -m "Synchronisation SportEasy validée par eSupport"
          git push origin HEAD:main

      - name: Demander la reconstruction de la version publique
        id: pages_build
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Attendre les données validées sur le site public
        id: verify_public
        if: steps.publication.outputs.changed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("fs");
            const files = ["player-secondary-data.js", "team-data.js", "pantheon-data.js"];
            const expected = files.map(file => {
              const text = fs.readFileSync(file, "utf8");
              const generatedAt = text.match(/"generatedAt"\s*:\s*"([^"]+)"/)?.[1];
              if (!generatedAt) throw new Error(`Date de génération introuvable dans ${file}.`);
              return {file, generatedAt};
            });
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              const checks = await Promise.all(expected.map(async ({file, generatedAt}) => {
                const url = `https://lykosfutsalclub-cmd.github.io/performance-hub/${file}`;
                const response = await fetch(`${url}?validation=${Date.now()}`, {cache:"no-store"});
                const text = response.ok ? await response.text() : "";
                return text.includes(generatedAt);
              }));
              if (checks.every(Boolean)) return;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error("La version publique n’a pas confirmé les trois espaces de données dans le délai prévu.");

      - name: Lancer le contrôle privé ou le rapport prévu
        id: private_control
        if: steps.mission.outputs.active == 'true' || steps.mission.outputs.oscar == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ESTAFF_SERVICE_URL: https://performance-hub-lykos-fc.fab-mysterio.chatgpt.site/api/estaff/worker/esupport-check
          ESTAFF_MODE: ${{ steps.mission.outputs.mode }}
          ESTAFF_CONTROL: ${{ steps.mission.outputs.active }}
          ESTAFF_OSCAR: ${{ steps.mission.outputs.oscar }}
          DATA_CHANGED: ${{ steps.publication.outputs.changed }}
        with:
          script: |
            const mode = process.env.ESTAFF_MODE;
            const controlDue = process.env.ESTAFF_CONTROL === "true";
            const oscarDue = process.env.ESTAFF_OSCAR === "true";
            if (!["daily", "digest", "release", "manual"].includes(mode)) {
              core.setFailed("Mode eSupport absent ou invalide.");
              return;
            }

            const identity = await core.getIDToken("lykos-estaff-esupport");
            let report = null;
            if (controlDue) {
              const response = await fetch(process.env.ESTAFF_SERVICE_URL, {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${identity}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({mode}),
              });
              report = await response.json().catch(() => ({}));
              if (!response.ok) {
                core.setFailed(`Le service eSupport a refusé le contrôle (${response.status}).`);
                return;
              }
              core.notice(report.summary || "Contrôle eSupport terminé.");
              if (report.status !== "operational") {
                core.setFailed(report.summary || "eSupport n’est pas pleinement opérationnel.");
              }
            }
            if (oscarDue) {
              const briefResponse = await fetch(process.env.ESTAFF_SERVICE_URL.replace("esupport-check", "oscar-brief"), {
                method: "POST",
                headers: {Authorization: `Bearer ${identity}`},
              });
              if (!briefResponse.ok) core.setFailed(`Le brief quotidien d’Oscar a échoué (${briefResponse.status}).`);
            }
            if (report?.status === "operational" && process.env.DATA_CHANGED === "true") {
              const giannisResponse = await fetch(process.env.ESTAFF_SERVICE_URL.replace("esupport-check", "giannis-analysis"), {
                method: "POST",
                headers: {Authorization: `Bearer ${identity}`},
              });
              if (!giannisResponse.ok) core.setFailed(`L’analyse de Giannis a échoué (${giannisResponse.status}).`);
            }

      - name: Enregistrer séparément les cinq preuves d’exécution
        if: ${{ always() && steps.mission.outputs.active == 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OPERATION_STATE_URL: https://lykos-estaff-service.lykosfutsalclub.workers.dev/api/estaff/worker/operation-state
          ESTAFF_MODE: ${{ steps.mission.outputs.mode }}
          SYNC_REQUESTED: ${{ steps.mission.outputs.sync }}
          SYNC_PLAYERS_OUTCOME: ${{ steps.sync_players.outcome }}
          SYNC_MATCHES_OUTCOME: ${{ steps.sync_matches.outcome }}
          BUILD_DATA_OUTCOME: ${{ steps.build_data.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          DATA_CHANGED: ${{ steps.publication.outputs.changed }}
          PUBLISH_OUTCOME: ${{ steps.publish_data.outcome }}
          PUBLIC_VERIFY_OUTCOME: ${{ steps.verify_public.outcome }}
          PRIVATE_CONTROL_OUTCOME: ${{ steps.private_control.outcome }}
        with:
          script: |
            const syncRequested = process.env.SYNC_REQUESTED === "true";
            const syncOutcomes = [
              process.env.SYNC_PLAYERS_OUTCOME,
              process.env.SYNC_MATCHES_OUTCOME,
              process.env.BUILD_DATA_OUTCOME,
              process.env.QUALITY_OUTCOME,
            ];
            const syncSucceeded = syncRequested && syncOutcomes.every(value => value === "success");
            const changed = process.env.DATA_CHANGED === "true";
            const published = changed && process.env.PUBLISH_OUTCOME === "success" && process.env.PUBLIC_VERIFY_OUTCOME === "success";
            const automationSucceeded = process.env.PRIVATE_CONTROL_OUTCOME === "success"
              && (!syncRequested || syncSucceeded)
              && (!changed || published);
            const operation = {
              operation:"sync",
              runId:`${context.runId}-${context.runAttempt}`,
              runUrl:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              mode:process.env.ESTAFF_MODE,
              occurredAt:new Date().toISOString(),
              stages:{
                automation:{
                  state:automationSucceeded ? "executed" : "failed",
                  detail:automationSucceeded
                    ? "Le circuit automatique et son contrôle privé sont terminés."
                    : "Le circuit automatique a démarré ; au moins un contrôle reste en échec ou incomplet.",
                },
                sporteasySync:{
                  state:!syncRequested ? "skipped" : syncSucceeded ? "attempted" : "failed",
                  detail:!syncRequested
                    ? "Ce déclenchement ne demandait pas de lecture SportEasy."
                    : syncSucceeded ? "La collecte SportEasy a été réellement tentée et ses données ont franchi le contrôle qualité."
                    : "La collecte SportEasy a été tentée mais n’a pas terminé toute la chaîne de contrôle.",
                },
                newData:{
                  state:!syncRequested ? "not_checked" : !syncSucceeded ? "unknown" : changed ? "present" : "none",
                  detail:!syncRequested ? "Aucune comparaison SportEasy demandée."
                    : !syncSucceeded ? "La comparaison n’a pas pu être certifiée."
                    : changed ? "Des différences validées ont été détectées."
                    : "La comparaison n’a détecté aucun changement à publier.",
                },
                publication:{
                  state:!syncRequested || !syncSucceeded ? "not_started" : !changed ? "not_required" : published ? "published" : "failed",
                  detail:!syncRequested ? "Aucune publication sportive demandée."
                    : !syncSucceeded ? "La publication n’a pas démarré car les contrôles précédents ne sont pas terminés."
                    : !changed ? "Aucun fichier différent : aucune publication nécessaire."
                    : published ? "La version publique a confirmé les trois jeux de données validés."
                    : "La publication ou sa vérification publique a échoué.",
                },
              },
            };
            const identity = await core.getIDToken("lykos-estaff-esupport");
            const response = await fetch(process.env.OPERATION_STATE_URL, {
              method:"POST",
              headers:{Authorization:`Bearer ${identity}`,"Content-Type":"application/json"},
              body:JSON.stringify(operation),
            });
            if (!response.ok) core.setFailed(`La preuve d’exécution n’a pas été enregistrée (${response.status}).`);

      - name: Signaler clairement une synchronisation en échec
        if: ${{ failure() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MOBILE_ALERT_URL: https://performance-hub-lykos-fc.fab-mysterio.chatgpt.site/api/estaff/worker/mobile-alert
        with:
          script: |
            core.error("ALERTE eSupport : la synchronisation ou l’un de ses contrôles a échoué. Aucune donnée non validée ne doit être publiée.");
            try {
              const identity = await core.getIDToken("lykos-estaff-esupport");
              const response = await fetch(process.env.MOBILE_ALERT_URL, {
                method: "POST",
                headers: {Authorization: `Bearer ${identity}`, "Content-Type": "application/json"},
                body: JSON.stringify({kind:"synchronization_failure"}),
              });
              if (!response.ok) core.warning(`L’alerte mobile a été refusée (${response.status}).`);
            } catch (error) {
              core.warning(`L’alerte mobile n’a pas pu être envoyée : ${error.message}`);
            }
            await core.summary
              .addHeading("Alerte de synchronisation")
              .addRaw("La chaîne eSupport a échoué. Consultez la première étape en rouge : elle indique la cause et aucune donnée non validée ne doit être publiée.")
              .write();

  surveillance-fraicheur:
    name: Alerte de fraîcheur des données publiques
    needs: chaine-esupport
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Vérifier les trois jeux de données publics
        id: freshness_check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const maximumAgeMs = 36 * 60 * 60 * 1000;
            const base = "https://lykosfutsalclub-cmd.github.io/performance-hub/";
            const files = ["player-secondary-data.js", "team-data.js", "pantheon-data.js"];
            const stale = [];
            for (const file of files) {
              const response = await fetch(`${base}${file}?freshness=${Date.now()}`, {cache:"no-store"});
              if (!response.ok) {
                stale.push(`${file} est inaccessible (${response.status})`);
                continue;
              }
              const text = await response.text();
              const generatedAt = text.match(/"generatedAt"\s*:\s*"([^"]+)"/)?.[1];
              const age = Date.now() - Date.parse(generatedAt || "");
              if (!generatedAt || !Number.isFinite(age) || age > maximumAgeMs) {
                stale.push(`${file} est périmé ou non daté (${generatedAt || "date absente"})`);
              }
            }
            if (stale.length) {
              core.setFailed(`ALERTE fraîcheur : ${stale.join(" ; ")}`);
            } else {
              core.notice("Les trois jeux de données publics ont moins de 36 heures.");
            }

      - name: Prévenir sur mobile si les données sont trop anciennes
        if: ${{ failure() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const identity = await core.getIDToken("lykos-estaff-esupport");
            const response = await fetch("https://performance-hub-lykos-fc.fab-mysterio.chatgpt.site/api/estaff/worker/mobile-alert", {
              method: "POST",
              headers: {Authorization: `Bearer ${identity}`, "Content-Type": "application/json"},
              body: JSON.stringify({kind:"public_data_stale"}),
            });
            if (!response.ok) core.warning(`L’alerte mobile de fraîcheur a été refusée (${response.status}).`);

      - name: Enregistrer le contrôle de fraîcheur indépendamment
        if: ${{ always() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OPERATION_STATE_URL: https://lykos-estaff-service.lykosfutsalclub.workers.dev/api/estaff/worker/operation-state
          FRESHNESS_OUTCOME: ${{ steps.freshness_check.outcome }}
        with:
          script: |
            const fresh = process.env.FRESHNESS_OUTCOME === "success";
            const identity = await core.getIDToken("lykos-estaff-esupport");
            const response = await fetch(process.env.OPERATION_STATE_URL, {
              method:"POST",
              headers:{Authorization:`Bearer ${identity}`,"Content-Type":"application/json"},
              body:JSON.stringify({
                operation:"freshness",
                runId:`${context.runId}-${context.runAttempt}`,
                runUrl:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                mode:"monitor",
                occurredAt:new Date().toISOString(),
                stages:{freshness:{
                  state:fresh ? "fresh" : "stale",
                  detail:fresh ? "Les trois jeux de données publics ont moins de 36 heures." : "Au moins un jeu de données public est inaccessible, non daté ou trop ancien.",
                }},
              }),
            });
            if (!response.ok) core.setFailed(`La preuve de fraîcheur n’a pas été enregistrée (${response.status}).`);
